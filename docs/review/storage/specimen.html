<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Rucksack &amp; Regal · gezeichnete Objekte</title>
<link rel="stylesheet" href="../../../assets/fonts.css">
<style>
body{margin:0;width:1920px;height:1080px;box-sizing:border-box;padding:30px 40px;background:#f7f7fc;color:#202239;font-family:var(--mtp-font)}
h1{font-size:34px;margin:0 0 4px;letter-spacing:-.02em}p{margin:0 0 12px;font-size:18px;color:#4b4d68}
.row{display:flex;align-items:flex-end;gap:14px;margin-bottom:8px}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}figcaption{font-size:15px;color:#4b4d68}
svg{font-family:var(--mtp-font)}
</style></head><body>
<h1>Gezeichnete Objekte · src/metaphors.js</h1>
<p>Jede Zeile: ein Objekt mit seinen Zuständen. Kontur 2.5 px, letzte Spalte 4.5 px und «print».</p>
<div id="sheet"></div>
<script src="../../../src/metaphors.js"></script>
<script>
var M = Metaphors, rows = [
  [['rucksack', {}, 'normal'], ['rucksack', { sidePocket: 'highlight' }, 'sidePocket: highlight'], ['rucksack', { highlight: true }, 'highlight'], ['rucksack', { empty: true }, 'empty'], ['rucksack', { crossed: true }, 'crossed'], ['rucksack', { label: 'Maras Rucksack' }, 'label'], ['rucksack', { stroke: 4.5 }, '4.5 px'], ['rucksack', { look: 'print' }, 'print']],
  [['regal', {}, 'normal'], ['regal', { count: 3, labels: ['Allgemein', 'Pilotphase', 'Auswertung'] }, 'count: 3, labels'], ['regal', { highlight: 1 }, 'highlight: 1'], ['regal', { empty: true }, 'empty'], ['regal', { crossed: true }, 'crossed'], ['regal', { stroke: 4.5 }, '4.5 px']],
  [['haus', {}, 'normal'], ['haus', { open: true }, 'open'], ['haus', { highlight: true, label: 'Onboarding 2027' }, 'highlight, label'], ['zimmer', {}, 'zimmer + regal'], ['zimmer', { highlight: true }, 'highlight'], ['person', {}, 'normal'], ['person', { rucksack: true }, 'rucksack'], ['person', { rucksack: true, walking: true }, 'walking'], ['person', { crossed: true }, 'crossed'], ['schluessel', { size: 70 }, 'normal'], ['schluessel', { size: 70, highlight: true }, 'highlight']]
];
document.getElementById('sheet').innerHTML = rows.map(function (r) {
  return '<div class="row">' + r.map(function (x) { return '<figure>' + M[x[0]](Object.assign({ size: 178 }, x[1])) + '<figcaption>' + x[2] + '</figcaption></figure>'; }).join('') + '</div>';
}).join('');
</script></body></html>
