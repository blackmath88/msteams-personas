<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Mara arbeitet in drei Teams</title>
<desc id="desc">Drei Häuser stehen für Teams. Das Projektteam Onboarding 2027 ist als Hausquerschnitt geöffnet. Drei waagrechte Zimmer zeigen die Kanäle. Rechts neben der Pilotphase ist ein Dateischrank geöffnet, der eine Checkliste und zwei verschachtelte Ordner zeigt.</desc>
