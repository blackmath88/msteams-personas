<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara arbeitet in drei Teams</title>
<style>
  :root { color: #202239; background: #f5f5fb; font-family: "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide {
    container-type: inline-size;
    width: min(100%, 1920px);
    aspect-ratio: 16/9;
    margin: auto;
    padding: 3.7% 5% 2.65%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 1.7cqw;
    background: radial-gradient(ellipse at 88% 9%, #ecebff, transparent 55%), #f7f7fc;
  }
  .eyebrow { display: flex; align-items: center; gap: .65cqw; color: #45479a; font-size: 1.05cqw; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; margin: 0 0 .74cqw; }
  .eyebrow::before { content: ""; width: 1.65cqw; height: .22cqw; border-radius: 9px; background: #6264a7; }
  h1 { font-size: 4.55cqw; font-weight: 700; letter-spacing: -.055em; line-height: 1.04; margin: 0; }
  .deckline { font-size: 1.58cqw; color: #4b4d68; margin: .65cqw 0 0; }
  .houses { display: grid; align-content: center; align-items: start; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.65cqw; margin: 0; padding: 0; list-style: none; }
  .house { min-width: 0; display: flex; flex-direction: column; }
  .roof { height: 4.3cqw; flex: none; background: var(--roof); clip-path: polygon(50% 0, 100% 90%, 100% 100%, 0 100%, 0 90%); }
  .project .roof { clip-path: polygon(44% 0, 100% 87%, 100% 100%, 0 100%, 0 88%); }
  .partners .roof { clip-path: polygon(0 88%, 28% 0, 70% 0, 100% 88%, 100% 100%, 0 100%); }
  .core { --roof: #484aa1; --tint: #edecfc; --tile: #5153a8; --detail: #3e4086; }
  .project { --roof: #6250a4; --tint: #f1ebfc; --tile: #6952aa; --detail: #534187; }
  .partners { --roof: #3d5e8f; --tint: #eaf0fb; --tile: #42669a; --detail: #34557e; }
  .building { background: #fff; border: 1px solid #dbdcec; border-top: 0; box-shadow: 0 .55cqw 1.2cqw #28295d13; border-radius: 0 0 .72cqw .72cqw; overflow: hidden; }
  .label { padding: .84cqw .85cqw .8cqw; min-height: 7.05cqw; background: var(--tint); display: grid; grid-template-columns: 2.82cqw minmax(0, 1fr); gap: .7cqw; align-items: start; }
  .tile { display: grid; place-items: center; width: 2.82cqw; height: 2.82cqw; border-radius: .52cqw; background: var(--tile); color: #fff; font-size: 1.1cqw; font-weight: 700; }
  h2 { font-size: 1.6cqw; line-height: 1.12; margin: 0 0 .52cqw; letter-spacing: -.02em; min-height: 3.55cqw; display: flex; align-items: center; }
  .type { color: var(--detail); background: #ffffffb8; border-radius: .35cqw; padding: .2cqw .39cqw; font-size: .88cqw; font-weight: 700; }
  .scope { display: inline; margin: 0 0 0 .22cqw; font-size: .94cqw; color: #424760; }
  .column-labels, .room { display: grid; grid-template-columns: minmax(0, 1fr) 5.25cqw; }
  .column-labels { color: #494c6c; background: #f8f8fd; font-size: .88cqw; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; }
  .column-labels span { padding: .49cqw .76cqw; }
  .column-labels span:last-child { text-align: center; padding-inline: 0; }
  .rooms { list-style: none; margin: 0; padding: 0; }
  .room { min-height: 4.16cqw; border-top: 1px solid #e5e5ef; }
  .room-content { display: grid; align-content: center; padding: .47cqw .76cqw; }
  .room-name { font-size: 1.37cqw; font-weight: 700; line-height: 1.08; }
  .purpose { font-size: 1.04cqw; color: #494e68; line-height: 1.14; margin-top: .27cqw; }
  .cabinet { background: var(--tint); color: var(--detail); border-left: 1px solid #e1e2ef; display: grid; place-items: center; }
  .cabinet svg { width: 2.05cqw; height: 2.05cqw; }
  footer { display: flex; justify-content: space-between; gap: 1cqw; border-top: 1px solid #d8d9ed; padding-top: .78cqw; color: #4d5070; font-size: 1.01cqw; }
  footer strong { color: #464890; }
</style>
</head>
<body>
<main class="slide" aria-labelledby="title">
  <header>
    <p class="eyebrow">Teams sinnvoll nutzen · Maras Perspektive</p>
    <h1 id="title">Mara arbeitet in drei Teams</h1>
    <p class="deckline">Die Zimmer zeigen, woran die Teams arbeiten. Rechts liegen die Dateien zum jeweiligen Kanal.</p>
  </header>
  <ul class="houses" aria-label="Maras drei Teams"></ul>
  <footer>
    <span>Fiktives Beispiel · Universität Basel</span>
    <span><strong>Haus</strong> = Team &nbsp;·&nbsp; <strong>Zimmer</strong> = Kanal &nbsp;·&nbsp; <strong>Schrank</strong> = Dateien</span>
  </footer>
</main>
<template id="house">
  <li class="house">
    <div class="roof" aria-hidden="true"></div>
    <section class="building">
      <header class="label">
        <span class="tile" aria-hidden="true"></span>
        <div><h2></h2><span class="type"></span><p class="scope"></p></div>
      </header>
      <div class="column-labels" aria-hidden="true"><span>Kanäle</span><span>Dateien</span></div>
      <ul class="rooms" aria-label="Kanäle und Dateiablagen"></ul>
    </section>
  </li>
</template>
<template id="room">
  <li class="room">
    <span class="room-content"><span class="room-name"></span><span class="purpose"></span></span>
    <span class="cabinet" role="img" aria-label="Dateiablage">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="5" y="4" width="22" height="23" rx="2"/>
        <path d="M5 15.5h22m-14-6h6m-6 11.5h6M9 27v2m14-2v2"/>
      </svg>
    </span>
  </li>
</template>
<script>
  const teams = [
    { style: 'core', initials: 'CP', name: 'Campus & People Development', type: 'Stammteam', scope: 'Eigener Bereich',
      rooms: [
        ['Allgemein', 'Mitteilungen im Team'],
        ['Leadership Forum', 'Anlässe vorbereiten'],
        ['Learning Programme', 'Weiterbildungen planen'],
        ['Interne Organisation', 'Aufgaben und Zuständigkeiten'],
      ] },
    { style: 'project', initials: 'O', name: 'Onboarding 2027', type: 'Projektteam', scope: 'Mehrere Bereiche',
      rooms: [
        ['Allgemein', 'Projektstand und Termine'],
        ['Pilotphase', 'Testlauf vorbereiten'],
        ['Auswertung', 'Rückmeldungen besprechen'],
      ] },
    { style: 'partners', initials: 'WK', name: 'Weiterbildungskooperation', type: 'Arbeitsgruppe', scope: 'Externe Partner',
      rooms: [
        ['Allgemein', 'Absprachen mit Partnern'],
        ['Workshop-Planung', 'Programm und Ablauf'],
        ['Kursmaterial', 'Unterlagen gemeinsam pflegen'],
      ] },
  ];
  const template = document.querySelector('#house');
  const roomTemplate = document.querySelector('#room');
  const houses = document.querySelector('.houses');
  for (const team of teams) {
    const house = template.content.firstElementChild.cloneNode(true);
    house.classList.add(team.style);
    house.querySelector('.tile').textContent = team.initials;
    house.querySelector('h2').textContent = team.name;
    house.querySelector('.type').textContent = team.type;
    house.querySelector('.scope').textContent = team.scope;
    const rooms = house.querySelector('.rooms');
    for (const [name, purpose] of team.rooms) {
      const room = roomTemplate.content.firstElementChild.cloneNode(true);
      room.querySelector('.room-name').textContent = name;
      room.querySelector('.purpose').textContent = purpose;
      rooms.append(room);
    }
    houses.append(house);
  }
</script>
</body>
</html>
