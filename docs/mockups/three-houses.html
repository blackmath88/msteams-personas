<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara arbeitet in drei Teams</title>
<style>
  :root { color: #202239; background: #f5f5fb; font-family: "Segoe UI", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide {
    container-type: inline-size;
    width: min(100%, 1920px);
    aspect-ratio: 16/9;
    margin: auto;
    padding: 3.7% 5% 2.65%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 1.7cqw;
    background: radial-gradient(ellipse at 88% 9%, #ecebff, transparent 55%), #f7f7fc;
  }
  .eyebrow { display: flex; align-items: center; gap: .65cqw; color: #45479a; font-size: 1.05cqw; font-weight: 700; letter-spacing: .11em; text-transform: uppercase; margin: 0 0 .74cqw; }
  .eyebrow::before { content: ""; width: 1.65cqw; height: .22cqw; border-radius: 9px; background: #6264a7; }
  h1 { font-size: 4.55cqw; font-weight: 700; letter-spacing: -.055em; line-height: 1.04; margin: 0; }
  .deckline { font-size: 1.58cqw; color: #4b4d68; margin: .65cqw 0 0; }
  .houses { display: grid; position: relative; align-content: center; align-items: end; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.75cqw; margin: 0; padding: 0; list-style: none; }
  .house { min-width: 0; display: flex; flex-direction: column; align-self: end; }
  .roof { display: block; width: 100%; overflow: visible; }
  .roof-face { fill: var(--roof); }
  .roof-light { fill: var(--roof-light); }
  .roof-edge { fill: none; stroke: var(--trim); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .roof-edge.chimney { fill: var(--roof-light); }
  .core { --roof: #6264a7; --roof-light: #7679b8; --trim: #3c3f80; --tint: #eeeffc; --tile: #5b5fc7; }
  .project { --roof: #775da4; --roof-light: #8b71b3; --trim: #4c3874; --tint: #f3edf9; --tile: #7655a6; }
  .partners { --roof: #5078a2; --roof-light: #688bb0; --trim: #304e74; --tint: #ecf2fb; --tile: #34659b; }
  .building { margin: -.1cqw .76cqw 0; background: #f5f5f5; border-inline: .27cqw solid var(--trim); box-shadow: 0 .5cqw 1.1cqw #28295d15; }
  .label { padding: .78cqw .76cqw .64cqw; background: #f5f5f5; display: grid; grid-template-columns: 1cqw 2.4cqw minmax(0, 1fr); gap: .52cqw; align-items: center; min-height: 5.66cqw; }
  .fi { width: 1.33cqw; height: 1.33cqw; color: #616161; flex: none; }
  .label > .fi { width: 1cqw; height: 1cqw; }
  .tile { display: grid; place-items: center; width: 2.4cqw; height: 2.4cqw; border-radius: .42cqw; background: var(--tile); color: #fff; font-size: 1.03cqw; font-weight: 700; }
  h2 { font-size: 1.48cqw; line-height: 1.06; margin: 0 0 .3cqw; letter-spacing: -.025em; }
  .type { color: var(--trim); background: var(--tint); border-radius: .28cqw; padding: .16cqw .32cqw; font-size: .82cqw; font-weight: 700; white-space: nowrap; }
  .scope { display: inline; margin: 0 0 0 .27cqw; font-size: .87cqw; color: #505050; white-space: nowrap; }
  .column-labels, .room { display: grid; grid-template-columns: minmax(0, 1fr) 4.75cqw; }
  .column-labels { color: #555; background: #fff; font-size: .78cqw; font-weight: 700; }
  .column-labels span { padding: .36cqw .7cqw; }
  .column-labels span:last-child { text-align: center; padding-inline: 0; color: var(--trim); border-bottom: .15cqw solid var(--tile); }
  .rooms { list-style: none; margin: 0; padding: 0; }
  .room { min-height: 4.38cqw; border-top: .17cqw solid #c8c9d4; background: linear-gradient(180deg,#fff 85%,#f2f0f3 85%); }
  .room-content { display: grid; grid-template-columns: 2.1cqw minmax(0, 1fr); align-items: center; gap: .53cqw; padding: .41cqw .62cqw .57cqw; }
  .room-icon { display: grid; place-items: center; border-radius: .35cqw; background: var(--tint); width: 2.08cqw; height: 2.08cqw; }
  .room-icon .fi { width: 1.3cqw; height: 1.3cqw; color: var(--trim); }
  .room-name { display: block; font-size: 1.27cqw; font-weight: 700; line-height: 1.08; color: #242424; }
  .purpose { display: block; font-size: .96cqw; color: #484848; line-height: 1.13; margin-top: .2cqw; }
  .cabinet { background: var(--tint); color: var(--trim); border-left: .13cqw solid #d5d4e1; display: grid; place-items: center; }
  .cabinet svg { width: 2.45cqw; height: 2.45cqw; }
  .foundation { height: .52cqw; border-radius: .13cqw; margin-inline: .26cqw; background: var(--trim); box-shadow: 0 .27cqw 0 -.07cqw #9a9cb4, 0 .52cqw .7cqw #32355320; }
  footer { display: flex; justify-content: space-between; gap: 1cqw; border-top: 1px solid #d8d9ed; padding-top: .78cqw; color: #4d5070; font-size: 1.01cqw; }
  footer strong { color: #464890; }
</style>
</head>
<body>
<main class="slide" aria-labelledby="title">
  <header>
    <p class="eyebrow">Teams sinnvoll nutzen · Maras Perspektive</p>
    <h1 id="title">Mara arbeitet in drei Teams</h1>
    <p class="deckline">Die Zimmer zeigen, woran die Teams arbeiten. Rechts liegen die Dateien zum jeweiligen Kanal.</p>
  </header>
  <ul class="houses" aria-label="Maras drei Teams"></ul>
  <footer>
    <span>Fiktives Beispiel · Universität Basel</span>
    <span><strong>Haus</strong> = Team &nbsp;·&nbsp; <strong>Zimmer</strong> = Kanal &nbsp;·&nbsp; <strong>Schrank</strong> = Dateien</span>
  </footer>
</main>
<template id="house">
  <li class="house">
    <section class="building">
      <header class="label">
        <span class="tile" aria-hidden="true"></span>
        <div><h2></h2><span class="type"></span><p class="scope"></p></div>
      </header>
      <div class="column-labels" aria-hidden="true"><span>Kanäle</span><span>Dateien</span></div>
      <ul class="rooms" aria-label="Kanäle und Dateiablagen"></ul>
    </section>
    <div class="foundation" aria-hidden="true"></div>
  </li>
</template>
<template id="room">
  <li class="room">
    <span class="room-content"><span class="room-icon"></span><span><span class="room-name"></span><span class="purpose"></span></span></span>
    <span class="cabinet" role="img" aria-label="Dateiablage">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="5" y="4" width="22" height="23" rx="2" fill="white"/>
        <path d="M5 15.5h22m-14-6h6m-6 11.5h6M9 27v2m14-2v2"/>
        <path d="M27 5l3 2v19l-3 2z" fill="currentColor" stroke="none" opacity=".27"/>
      </svg>
    </span>
  </li>
</template>
<script>
  /* Fluent UI System Icons from src/m365.js.

AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
SOFTWARE.
  */
  const icons = {
    "board": "M3 6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3zm3-2a2 2 0 0 0-2 2v1.06L9.5 7V4zm4.5 0v8H16V6a2 2 0 0 0-2-2zm5.5 9h-5.5v3H14a2 2 0 0 0 2-2zm-6.5 3V8L4 8.06V14c0 1.1.9 2 2 2z",
    "calendar": "M7 11a1 1 0 1 0 0-2 1 1 0 0 0 0 2m1 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0m2-2a1 1 0 1 0 0-2 1 1 0 0 0 0 2m1 2a1 1 0 1 1-2 0 1 1 0 0 1 2 0m2-2a1 1 0 1 0 0-2 1 1 0 0 0 0 2m4-5.5A2.5 2.5 0 0 0 14.5 3h-9A2.5 2.5 0 0 0 3 5.5v9A2.5 2.5 0 0 0 5.5 17h9a2.5 2.5 0 0 0 2.5-2.5zM4 7h12v7.5c0 .83-.67 1.5-1.5 1.5h-9A1.5 1.5 0 0 1 4 14.5zm1.5-3h9c.83 0 1.5.67 1.5 1.5V6H4v-.5C4 4.67 4.67 4 5.5 4",
    "chat": "M10 2a8 8 0 1 1-3.61 15.14l-.12-.07-3.65.92a.5.5 0 0 1-.62-.45v-.08l.01-.08.92-3.64-.07-.12a8 8 0 0 1-.83-2.9l-.02-.37L2 10a8 8 0 0 1 8-8m0 1a7 7 0 0 0-6.1 10.42.5.5 0 0 1 .06.28l-.02.1-.75 3.01 3.02-.75.19-.01.09.02.09.04A7 7 0 1 0 10 3m.5 8a.5.5 0 0 1 .09 1H7.5a.5.5 0 0 1-.09-1h3.09m2-3a.5.5 0 0 1 .09 1H7.5a.5.5 0 0 1-.09-1h5.09",
    "chevd": "M15.85 7.65c.2.2.2.5 0 .7l-5.46 5.49a.55.55 0 0 1-.78 0L4.15 8.35a.5.5 0 1 1 .7-.7L10 12.8l5.15-5.16c.2-.2.5-.2.7 0",
    "listcheck": "M5.85 4.35a.5.5 0 1 0-.7-.7L3.5 5.29l-.65-.64a.5.5 0 1 0-.7.7l1 1c.2.2.5.2.7 0zM8.5 5a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1zm0 5a.5.5 0 0 0 0 1h9a.5.5 0 0 0 0-1zM8 15.5c0-.28.22-.5.5-.5h9a.5.5 0 0 1 0 1h-9a.5.5 0 0 1-.5-.5M5.85 9.85a.5.5 0 1 0-.7-.7L3.5 10.79l-.65-.64a.5.5 0 0 0-.7.7l1 1c.2.2.5.2.7 0zm0 4.3c.2.2.2.5 0 .7l-2 2a.5.5 0 0 1-.7 0l-1-1a.5.5 0 0 1 .7-.7l.65.64 1.65-1.64c.2-.2.5-.2.7 0",
    "people": "M4.5 6.75a2.25 2.25 0 1 1 4.5 0 2.25 2.25 0 0 1-4.5 0M6.75 3.5a3.25 3.25 0 1 0 0 6.5 3.25 3.25 0 0 0 0-6.5m5.69 11.65q.79.33 2.06.35c1.88 0 2.92-.67 3.47-1.43a3 3 0 0 0 .53-1.5v-.07c0-.83-.67-1.5-1.5-1.5h-4.63q.36.44.53 1H17c.28 0 .5.22.5.5v.1l-.04.22q-.05.29-.3.66c-.33.46-1.04 1.02-2.66 1.02q-1.08-.01-1.69-.28-.12.43-.37.93M1.5 13c0-1.1.9-2 2-2H10a2 2 0 0 1 2 2v.08l-.01.18q-.01.17-.08.45c-.08.37-.25.86-.6 1.36-.7 1.01-2.05 1.93-4.56 1.93s-3.87-.92-4.57-1.93a4 4 0 0 1-.68-1.99V13m1 .06v.1l.06.33c.07.27.2.64.45 1C3.49 15.2 4.5 16 6.75 16s3.26-.8 3.74-1.5a3 3 0 0 0 .5-1.42l.01-.02V13a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1zM13 7.5a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0M14.5 5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5",
    "share": "M9.5 3a.5.5 0 0 1 0 1H6a2 2 0 0 0-2 2v8c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2v-1.5a.5.5 0 0 1 1 0V14a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zm3.8-.96a.5.5 0 0 1 .53.09l5 4.5a.5.5 0 0 1 0 .74l-5 4.5a.5.5 0 0 1-.83-.37V9.34c-1.4.13-2.67.78-3.7 1.6a10 10 0 0 0-2.2 2.5l-.15.28A.5.5 0 0 1 6 13.5c0-2.05.38-4.28 1.52-6.02A6.6 6.6 0 0 1 13 4.5V2.43a.5.5 0 0 1 .3-.39M14 5a.5.5 0 0 1-.5.5c-2.59 0-4.18 1.05-5.14 2.52a9 9 0 0 0-1.25 3.69 11 11 0 0 1 1.56-1.54 7.8 7.8 0 0 1 4.83-1.85c.28 0 .5.22.5.5v1.56L17.75 7 14 3.62z"
  };
  const fluent = name => `<svg class="fi" viewBox="0 0 20 20" aria-hidden="true"><path d="${icons[name]}" fill="currentColor"/></svg>`;

  const roofs = {
    core: { outline: 'M5 125L250 13 495 125Z', shade: 'M250 13L495 125H250Z', window: [250,79], chimney: 372 },
    project: { outline: 'M5 125L128 24H278L495 125Z', shade: 'M278 24L495 125H322Z', window: [199,77], chimney: 353 },
    partners: { outline: 'M5 125L93 46H157L258 8 495 125Z', shade: 'M258 8L495 125H280Z', window: [258,76], chimney: 391 },
  };

  function roofFor(style) {
    const {outline, shade, window: [x, y], chimney} = roofs[style];
    return `<svg class="roof" viewBox="0 0 500 130" aria-hidden="true">
      <defs><pattern id="tiles-${style}" width="54" height="26" patternUnits="userSpaceOnUse">
        <path d="M0 0h54M0 13h54M27 0v13M0 13v13" fill="none" stroke="white" opacity=".24" stroke-width="1.6"/>
      </pattern></defs>
      <path d="M${chimney} 84V36h29v56z" class="roof-edge chimney"/>
      <path d="M${chimney - 4} 36h37" class="roof-edge"/>
      <path d="${outline}" class="roof-face"/>
      <path d="${shade}" class="roof-light"/>
      <path d="${outline}" fill="url(#tiles-${style})"/>
      <path d="${outline}" class="roof-edge"/>
      <g transform="translate(${x} ${y})" stroke="var(--trim)" stroke-width="3">
        <path d="M-15 16v-20a15 15 0 0 1 30 0v20z" fill="#f3f3fb"/>
        <path d="M0 -18v34M-15 2h30M-19 17h38" fill="none"/>
      </g>
    </svg>`;
  }

  const teams = [
    { style: 'core', initials: 'CP', name: 'Campus & People Development', type: 'Stammteam', scope: 'Eigener Bereich',
      rooms: [
        ['Allgemein', 'Mitteilungen im Team', 'chat'],
        ['Leadership Forum', 'Anlässe vorbereiten', 'calendar'],
        ['Learning Programme', 'Weiterbildungen planen', 'people'],
        ['Interne Organisation', 'Aufgaben und Zuständigkeiten', 'listcheck'],
      ] },
    { style: 'project', initials: 'O', name: 'Onboarding 2027', type: 'Projektteam', scope: 'Mehrere Bereiche',
      rooms: [
        ['Allgemein', 'Projektstand und Termine', 'chat'],
        ['Pilotphase', 'Testlauf vorbereiten', 'board'],
        ['Auswertung', 'Rückmeldungen besprechen', 'listcheck'],
      ] },
    { style: 'partners', initials: 'WK', name: 'Weiterbildungskooperation', type: 'Arbeitsgruppe', scope: 'Externe Partner',
      rooms: [
        ['Allgemein', 'Absprachen mit Partnern', 'chat'],
        ['Workshop-Planung', 'Programm und Ablauf', 'calendar'],
        ['Kursmaterial', 'Unterlagen gemeinsam pflegen', 'share'],
      ] },
  ];
  const template = document.querySelector('#house');
  const roomTemplate = document.querySelector('#room');
  const houses = document.querySelector('.houses');
  for (const team of teams) {
    const house = template.content.firstElementChild.cloneNode(true);
    house.classList.add(team.style);
    house.insertAdjacentHTML('afterbegin', roofFor(team.style));
    house.querySelector('.label').insertAdjacentHTML('afterbegin', fluent('chevd'));
    house.querySelector('.tile').textContent = team.initials;
    house.querySelector('h2').textContent = team.name;
    house.querySelector('.type').textContent = team.type;
    house.querySelector('.scope').textContent = team.scope;
    const rooms = house.querySelector('.rooms');
    for (const [name, purpose, icon] of team.rooms) {
      const room = roomTemplate.content.firstElementChild.cloneNode(true);
      room.querySelector('.room-name').textContent = name;
      room.querySelector('.purpose').textContent = purpose;
      room.querySelector('.room-icon').innerHTML = fluent(icon);
      rooms.append(room);
    }
    houses.append(house);
  }
</script>
</body>
</html>
