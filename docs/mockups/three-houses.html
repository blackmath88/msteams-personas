<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara arbeitet in drei Teams</title>
<style>
  :root { color: #172723; background: #f4f1e9; font-family: "DejaVu Sans", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide {
    container-type: inline-size;
    width: min(100%, 1920px);
    aspect-ratio: 16/9;
    margin: auto;
    padding: 4.25% 5.5% 2.6%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 2.1cqw;
    background: #f4f1e9;
  }
  .eyebrow, .caption, .type { letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }
  .eyebrow { color: #49615a; font-size: 1.03cqw; margin: 0 0 1.06cqw; }
  h1 { font-size: 4.46cqw; font-weight: 700; letter-spacing: -.068em; line-height: 1; margin: 0; }
  .deckline { font-size: 1.54cqw; color: #43534b; margin: .83cqw 0 0; }
  .houses { display: grid; align-items: end; grid-template-columns: repeat(3, 1fr); gap: 2.45cqw; margin: 0; padding: 0; list-style: none; }
  .house { min-width: 0; }
  .figure {
    height: 22.6cqw;
    display: flex;
    flex-direction: column;
    justify-content: end;
    border-bottom: 1px solid #a2a79b;
  }
  .roof {
    height: 5.5cqw;
    flex: none;
    background: var(--roof);
    clip-path: polygon(50% 0, 100% 92%, 100% 100%, 0 100%, 0 92%);
  }
  .core { --wall: #e1e9df; --roof: #25483d; --line: #aebfae; --cabinet: #c9d9ca; }
  .project { --wall: #f3dfd0; --roof: #82472e; --line: #d5ae94; --cabinet: #ebc7ae; }
  .partners { --wall: #e2e8ef; --roof: #3b4e68; --line: #aebdcb; --cabinet: #ccd9e6; }
  .project .roof { clip-path: polygon(43% 0, 100% 88%, 100% 100%, 0 100%, 0 87%); }
  .partners .roof { clip-path: polygon(0 89%, 28% 0, 68% 0, 100% 89%, 100% 100%, 0 100%); }
  .rooms { list-style: none; margin: 0; padding: 0; border-inline: 1px solid var(--line); }
  .room {
    min-height: 4.15cqw;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 4.4cqw;
    border-top: 1px solid var(--line);
    background: var(--wall);
  }
  .room-name { align-self: center; padding: .35cqw .84cqw; font-size: 1.52cqw; font-weight: 700; }
  .cabinet {
    background: var(--cabinet);
    color: var(--roof);
    border-left: 1px solid var(--line);
    display: grid;
    place-items: center;
  }
  .cabinet svg { display: block; width: 2.15cqw; height: 2.15cqw; }
  .label { padding: 1.18cqw 0 .25cqw; min-height: 8.65cqw; }
  .type { color: var(--roof); font-size: .99cqw; margin: 0 0 .55cqw; }
  h2 { font-size: 1.66cqw; line-height: 1.1; margin: 0; letter-spacing: -.04em; }
  .scope { margin: .49cqw 0 0; font-size: 1.18cqw; color: #43534b; }
  footer { display: flex; justify-content: space-between; border-top: 1px solid #b5b6a9; padding-top: .9cqw; color: #46574f; }
  .caption { font-size: .84cqw; }
  @media (max-width: 560px) {
    .slide { gap: 1.6cqw; }
    .label { min-height: 9.5cqw; }
  }
</style>
</head>
<body>
<main class="slide" aria-labelledby="title">
  <header>
    <p class="eyebrow">Teams sinnvoll nutzen · Maras Perspektive</p>
    <h1 id="title">Mara arbeitet in drei Teams</h1>
    <p class="deckline">Jeder Kanal hat ein Zimmer. Seine Dateien liegen im Schrank rechts.</p>
  </header>
  <ul class="houses" aria-label="Maras drei Teams"></ul>
  <footer>
    <span class="caption">Fiktives Beispiel · Universität Basel</span>
    <span class="caption">Haus = Team · Zimmer = Kanal · Schrank = Dateien</span>
  </footer>
</main>
<template id="house">
  <li class="house">
    <div class="figure">
      <div class="roof" aria-hidden="true"></div>
      <ul class="rooms" aria-label="Kanäle und Dateiablagen"></ul>
    </div>
    <div class="label"><p class="type"></p><h2></h2><p class="scope"></p></div>
  </li>
</template>
<template id="room">
  <li class="room">
    <span class="room-name"></span>
    <span class="cabinet" role="img" aria-label="Dateiablage">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <rect x="5" y="4" width="22" height="23" rx="2"/>
        <path d="M5 15.5h22m-14-6h6m-6 11.5h6M9 27v2m14-2v2"/>
      </svg>
    </span>
  </li>
</template>
<script>
  const teams = [
    { style: 'core', name: 'Campus & People Development', type: 'Stammteam', scope: 'Mit dem eigenen Bereich', rooms: ['Allgemein', 'Leadership Forum', 'Learning Programme', 'Interne Organisation'] },
    { style: 'project', name: 'Onboarding 2027', type: 'Projektteam', scope: 'Über mehrere Bereiche hinweg', rooms: ['Allgemein', 'Pilotphase', 'Auswertung'] },
    { style: 'partners', name: 'Weiterbildungskooperation', type: 'Arbeitsgruppe', scope: 'Mit externen Partnern', rooms: ['Allgemein', 'Workshop-Planung', 'Kursmaterial'] },
  ];
  const template = document.querySelector('#house');
  const roomTemplate = document.querySelector('#room');
  const houses = document.querySelector('.houses');
  for (const team of teams) {
    const house = template.content.firstElementChild.cloneNode(true);
    house.classList.add(team.style);
    house.querySelector('h2').textContent = team.name;
    house.querySelector('.type').textContent = team.type;
    house.querySelector('.scope').textContent = team.scope;
    const rooms = house.querySelector('.rooms');
    for (const name of team.rooms) {
      const room = roomTemplate.content.firstElementChild.cloneNode(true);
      room.querySelector('.room-name').textContent = name;
      rooms.append(room);
    }
    houses.append(house);
  }
</script>
</body>
</html>
