<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mara arbeitet in drei Teams</title>
<style>
  :root { color: #172723; background: #f4f1e9; font-family: "DejaVu Sans", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .slide {
    container-type: inline-size;
    width: min(100%, 1920px);
    aspect-ratio: 16/9;
    margin: auto;
    padding: 4.25% 5.5% 2.6%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 2.1cqw;
    background: #f4f1e9;
  }
  .eyebrow, .caption, .type { letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }
  .eyebrow { color: #49615a; font-size: 1.03cqw; margin: 0 0 1.06cqw; }
  h1 { font-size: 4.46cqw; font-weight: 700; letter-spacing: -.068em; line-height: 1; margin: 0; }
  .deckline { font-size: 1.54cqw; color: #43534b; margin: .83cqw 0 0; }
  .houses { display: grid; align-items: end; grid-template-columns: repeat(3, 1fr); gap: 2.45cqw; margin: 0; padding: 0; list-style: none; }
  .house { min-width: 0; }
  .figure { height: 19.5cqw; display: flex; align-items: end; justify-content: center; border-bottom: 1px solid #a2a79b; }
  .model { width: 89%; height: 91%; position: relative; }
  .body, .roof, .shade, .window, .door { position: absolute; }
  .body { left: 9%; right: 9%; bottom: 0; height: 65%; background: var(--wall); }
  .roof { inset: 1% 0 61%; background: var(--roof); clip-path: polygon(50% 0, 100% 91%, 100% 100%, 0 100%, 0 91%); z-index: 1; }
  .shade { inset: 0 0 0 auto; width: 23%; background: var(--shade); }
  .window { top: 29%; left: 17%; width: 22%; height: 26%; background: var(--light); box-shadow: inset 0 -.24cqw 0 var(--roof); }
  .window.second { left: 46%; }
  .door { left: 29%; bottom: 0; width: 22%; height: 35%; background: var(--roof); }
  .core { --wall: #7e9a87; --roof: #25483d; --shade: #587866; --light: #d8e5ce; --accent: #25483d; }
  .project { --wall: #df9f76; --roof: #82472e; --shade: #b97652; --light: #f6dbc2; --accent: #82472e; }
  .partners { --wall: #9cacc1; --roof: #3b4e68; --shade: #778ca8; --light: #dce6ef; --accent: #3b4e68; }
  .project .model { width: 78%; height: 100%; }
  .project .roof { inset: 0 0 57%; clip-path: polygon(43% 0, 100% 88%, 100% 100%, 0 100%, 0 85%); }
  .project .body { height: 61%; }
  .project .window { left: 21%; top: 23%; width: 42%; height: 25%; }
  .project .window.second { display: none; }
  .project .door { left: 48%; }
  .partners .model { width: 95%; height: 83%; }
  .partners .roof { inset: 0 0 59%; clip-path: polygon(0 88%, 28% 0, 68% 0, 100% 88%, 100% 100%, 0 100%); }
  .partners .body { height: 62%; }
  .partners .door { left: 45%; width: 25%; }
  .label { padding: 1.18cqw 0 .25cqw; min-height: 8.65cqw; }
  .type { color: var(--accent); font-size: .99cqw; margin: 0 0 .55cqw; }
  h2 { font-size: 1.66cqw; line-height: 1.1; margin: 0; letter-spacing: -.04em; }
  .scope { margin: .49cqw 0 0; font-size: 1.18cqw; color: #43534b; }
  footer { display: flex; justify-content: space-between; border-top: 1px solid #b5b6a9; padding-top: .9cqw; color: #46574f; }
  .caption { font-size: .84cqw; }
  @media (max-width: 560px) {
    .slide { gap: 1.6cqw; }
    .label { min-height: 9.5cqw; }
  }
</style>
</head>
<body>
<main class="slide" aria-labelledby="title">
  <header>
    <p class="eyebrow">Teams sinnvoll nutzen · Maras Perspektive</p>
    <h1 id="title">Mara arbeitet in drei Teams</h1>
    <p class="deckline">Jedes Haus steht für eine andere Gruppe, mit der sie zusammenarbeitet.</p>
  </header>
  <ul class="houses" aria-label="Maras drei Teams"></ul>
  <footer>
    <span class="caption">Fiktives Beispiel · Universität Basel</span>
    <span class="caption">Haus = Team</span>
  </footer>
</main>
<template id="house">
  <li class="house">
    <div class="figure" aria-hidden="true">
      <div class="model">
        <div class="body"><div class="shade"></div><div class="window"></div><div class="window second"></div><div class="door"></div></div>
        <div class="roof"></div>
      </div>
    </div>
    <div class="label"><p class="type"></p><h2></h2><p class="scope"></p></div>
  </li>
</template>
<script>
  const teams = [
    { style: 'core', name: 'Campus & People Development', type: 'Stammteam', scope: 'Mit dem eigenen Bereich' },
    { style: 'project', name: 'Onboarding 2027', type: 'Projektteam', scope: 'Über mehrere Bereiche hinweg' },
    { style: 'partners', name: 'Weiterbildungskooperation', type: 'Arbeitsgruppe', scope: 'Mit externen Partnern' },
  ];
  const template = document.querySelector('#house');
  const houses = document.querySelector('.houses');
  for (const team of teams) {
    const house = template.content.firstElementChild.cloneNode(true);
    house.classList.add(team.style);
    house.querySelector('h2').textContent = team.name;
    house.querySelector('.type').textContent = team.type;
    house.querySelector('.scope').textContent = team.scope;
    houses.append(house);
  }
</script>
</body>
</html>
